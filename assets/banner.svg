<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0F172A"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>

<linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8B5CF6"/>
<stop offset="100%" stop-color="#38BDF8"/>
</linearGradient>

</defs>

<!-- Background -->

<rect width="1200" height="300" rx="20" fill="url(#bg)"/>

<!-- Decorative circles -->

<circle cx="1080" cy="60" r="90" fill="#8B5CF6" opacity=".08"/>

<circle cx="120" cy="250" r="70" fill="#38BDF8" opacity=".08"/>

<!-- Hi -->

<text
x="80"
y="90"
font-size="42"
font-family="Segoe UI Emoji">

👋

<animateTransform
attributeName="transform"
type="rotate"
values="0 92 78;18 92 78;0 92 78;-10 92 78;0 92 78"
dur="2s"
repeatCount="indefinite"/>

</text>

<!-- Hi Text -->

<text
x="140"
y="92"
font-size="30"
font-family="Segoe UI"
fill="#E5E7EB">

Hi, I'm

</text>

<!-- Name -->

<text
x="80"
y="150"
font-size="58"
font-weight="700"
font-family="Segoe UI"
fill="url(#name)">

Danial Karimi

</text>

<!-- Title -->

<text
x="82"
y="190"
font-size="24"
font-family="Segoe UI"
fill="#CBD5E1">

AI Engineer • Computer Engineer

</text>

<!-- Divider -->

<line
x1="80"
x2="540"
y1="210"
y2="210"
stroke="#334155"/>

<!-- Skills -->

<text
x="82"
y="245"
font-size="18"
font-family="Consolas"
fill="#38BDF8">

Python • C# • AI • Machine Learning • Linux • Git

</text>

<!-- Quote -->

<text
x="82"
y="275"
font-size="18"
font-family="Segoe UI"
fill="#94A3B8">

Building Intelligent Systems.

</text>

</svg>