<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 420"
     width="1280"
     height="420">

<defs>

<!-- Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="55%" stop-color="#0B1120"/>
    <stop offset="100%" stop-color="#1B0F3F"/>
</linearGradient>

<!-- Text -->
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9F67FF"/>
    <stop offset="100%" stop-color="#36CFFF"/>
</linearGradient>

<!-- Glass -->
<linearGradient id="glass">
    <stop offset="0%" stop-color="#FFFFFF18"/>
    <stop offset="100%" stop-color="#FFFFFF05"/>
</linearGradient>

<!-- Glow -->
<filter id="glow">
    <feGaussianBlur stdDeviation="5"/>
</filter>

<filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
</filter>

</defs>

